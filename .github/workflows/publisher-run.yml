name: Publisher run

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Maximum tasks to process sequentially
        required: true
        default: "3"
      max_minutes:
        description: Stop claiming work after this time budget
        required: true
        default: "240"
      platforms:
        description: Comma-separated platforms or all
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: aether-publisher-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
      STUDIO_AGENT_KEY: ${{ secrets.STUDIO_AGENT_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      AGENT_ID: github-actions-publisher
      MAX_TASKS: ${{ inputs.max_tasks }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore runtime secrets
        env:
          ACCOUNTS_YAML_B64: ${{ secrets.ACCOUNTS_YAML_B64 }}
          COOKIE_BUNDLE_B64: ${{ secrets.COOKIE_BUNDLE_B64 }}
          CF_WARP_MDM_B64: ${{ secrets.CF_WARP_MDM_B64 }}
        run: |
          set -euo pipefail
          mkdir -p runtime/data/accounts runtime/data/cache runtime/warp
          test -n "$ACCOUNTS_YAML_B64"
          test -n "$COOKIE_BUNDLE_B64"
          test -n "$CF_WARP_MDM_B64"
          printf '%s' "$ACCOUNTS_YAML_B64" | base64 --decode > runtime/accounts.yaml
          printf '%s' "$COOKIE_BUNDLE_B64" | base64 --decode | tar -xz -C runtime/data/accounts
          printf '%s' "$CF_WARP_MDM_B64" | base64 --decode > runtime/warp/mdm.xml
          chmod 600 runtime/accounts.yaml runtime/warp/mdm.xml

      - name: Run bounded publisher batch
        run: ./scripts/runner-entrypoint.sh

      - name: Remove runtime secrets
        if: always()
        run: |
          find runtime -mindepth 1 -maxdepth 1 ! -name README.md ! -name .gitignore -exec rm -rf -- {} +
