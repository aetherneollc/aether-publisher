name: Account vault smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Access and vault API
        env:
          VAULT_URL: ${{ secrets.AETHER_VAULT_URL }}
          VAULT_TOKEN: ${{ secrets.AETHER_VAULT_RUNNER_TOKEN }}
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VAULT_URL"
          test -n "$VAULT_TOKEN"
          test -n "$ACCESS_ID"
          test -n "$ACCESS_SECRET"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $VAULT_TOKEN" \
            -H "CF-Access-Client-Id: $ACCESS_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_SECRET" \
            "$VAULT_URL/api/runner/accounts" \
            | jq -e '.accounts | type == "array"'
