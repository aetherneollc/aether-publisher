[project]
name = "dusk-publisher"
version = "0.1.0"
description = "Self-hostable, Docker-ized multi-platform video publisher (YouTube/TikTok/X) with browser-automation upload, cookie accounts, a standalone local queue, and an optional pull-mode worker for the 暮色工房 (dusk workshop) control plane."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dusk-publisher contributors" }]
keywords = ["video", "publishing", "youtube", "tiktok", "twitter", "x", "automation", "playwright", "patchright"]

dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.2,<9.0",
    "patchright>=1.45,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
]

[project.scripts]
dusk-publisher = "dusk_publisher.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
