services:
  dusk-publisher:
    # GitHub Actions publishes this image on push to main / v* tags.
    # Override for a local build: PUBLISHER_IMAGE=dusk-publisher:local docker compose up -d --build
    image: ${PUBLISHER_IMAGE:-ghcr.io/aetherneollc/dusk-publisher:main}
    build: .
    container_name: dusk-publisher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - ACCOUNTS_FILE=/app/config/accounts.yaml
      - LOCAL_QUEUE_FILE=/app/queue/local_queue.yaml
    volumes:
      # Cookie files: /data/accounts/<platform>/<account>.json (see README).
      # Named volume so cookies survive image rebuilds/`docker compose down`.
      - dusk-publisher-data:/data
      # Your account routing config (platform + optional lang -> account name).
      - ./config:/app/config:ro
      # Local queue mode task files (only needed if you don't use the
      # 暮色工房 control plane pull-mode; see README "Local queue mode").
      - ./queue:/app/queue
    # `login` needs a visible browser window. Default `daemon run` in CMD is
    # headless and fine to leave as `unless-stopped`. For interactive login,
    # run a one-off exec (see README) — it forces headed mode itself, which
    # requires either a local X server / VNC, or running dusk-publisher
    # outside Docker for that one step.
    command: ["daemon", "run"]
    # NOT published to the host by default: /healthz has no auth (see
    # README "Health checks"), so leaving it container-internal-only avoids
    # exposing operational metadata (disk space, whether cookies are valid,
    # version) on a public-facing VPS. `docker ps` / `docker inspect
    # --format='{{json .State.Health}}' dusk-publisher` already work
    # without publishing the port, since HEALTHCHECK below runs *inside*
    # the container. Uncomment to also curl it from the VPS host directly:
    # ports:
    #   - "127.0.0.1:8080:8080"   # bind to localhost only, not 0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "/app/scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  dusk-publisher-data:
